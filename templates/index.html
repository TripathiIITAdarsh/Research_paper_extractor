<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paper agent — multi-source search</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --border: #e4e6eb;
    --text: #15171c;
    --muted: #5e6470;
    --accent: #2b5bd7;
    --accent-2: #7c3aed;
    --accent-soft: #e8efff;
    --accent-soft-2: #f0e9fd;
    --error: #c0392b;
    --success: #2e7d4f;
    --shadow: 0 1px 3px rgba(10, 14, 28, 0.04), 0 2px 8px rgba(10, 14, 28, 0.04);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1116;
      --card: #1a1d24;
      --border: #2a2e37;
      --text: #ebedf1;
      --muted: #9aa0ab;
      --accent: #7aa2ff;
      --accent-2: #b088ff;
      --accent-soft: #1d2a48;
      --accent-soft-2: #2a1f44;
      --error: #ff7a6a;
      --success: #6ed29a;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.3), 0 2px 10px rgba(0, 0, 0, 0.25);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px 48px;
    line-height: 1.4;
  }
  header { max-width: 1200px; margin: 0 auto 16px; }
  h1 { font-size: 20px; margin: 0 0 14px; font-weight: 700; letter-spacing: -0.01em; }
  .controls {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch;
  }
  .controls input[type=text] {
    flex: 1 1 260px; min-width: 0;
    padding: 12px 14px; font-size: 16px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); color: var(--text);
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .controls input[type=text]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .controls input[type=number] {
    width: 72px; padding: 12px 10px; font-size: 15px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); color: var(--text);
    outline: none;
  }
  .field {
    display: flex; flex-direction: column; gap: 3px;
  }
  .field label {
    font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.04em;
    padding-left: 2px; font-weight: 600;
  }
  button {
    padding: 12px 20px; font-size: 15px; font-weight: 600;
    background: var(--accent); color: white; border: 0; border-radius: 10px;
    cursor: pointer; transition: opacity .15s, transform .05s;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { opacity: 0.92; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.5; cursor: wait; }
  .btn-secondary { background: var(--accent-2); }
  .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
  main { max-width: 1200px; margin: 0 auto; }
  .source {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 16px;
    overflow: hidden; box-shadow: var(--shadow);
  }
  .source-head {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; flex-wrap: wrap;
    padding: 12px 16px; background: var(--accent-soft);
    border-bottom: 1px solid var(--border);
  }
  .source-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .source-head .meta { font-size: 12px; color: var(--muted); }
  .err { padding: 12px 16px; color: var(--error); font-size: 13px; }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 640px; }
  th, td { padding: 10px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--accent-soft); }
  th { font-weight: 600; color: var(--muted); background: var(--bg); font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  td.num { text-align: right; white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  td.title { max-width: 480px; }
  td.title a { color: var(--text); text-decoration: none; font-weight: 500; }
  td.title a:hover { color: var(--accent); text-decoration: underline; }
  td.authors { color: var(--muted); max-width: 220px; font-size: 12.5px; }
  td.doi { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; color: var(--muted); max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
  td.doi a { color: var(--accent); text-decoration: none; }
  td.doi a:hover { text-decoration: underline; }
  .empty { padding: 16px; color: var(--muted); font-size: 13px; text-align: center; }
  .spinner { display: inline-block; width: 13px; height: 13px;
    border: 2px solid var(--muted); border-top-color: transparent;
    border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .merged .source-head {
    background: linear-gradient(90deg, var(--accent-soft), var(--accent-soft-2));
  }
  .merged h2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { display: inline-block; font-size: 10px; padding: 3px 7px;
    border-radius: 10px; background: var(--accent); color: white; font-weight: 700;
    letter-spacing: 0.4px; text-transform: uppercase; }
  .rank-controls { display: flex; align-items: center; gap: 8px; font-size: 13px; flex-wrap: wrap; }
  .rank-controls label { color: var(--muted); }
  select {
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--text); font-size: 13px;
    outline: none; cursor: pointer;
    appearance: none; -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 28px;
  }
  select:focus { border-color: var(--accent); }
  td.src-pills { white-space: nowrap; }
  td.journal { max-width: 180px; color: var(--muted); font-size: 12px; font-style: italic; }
  .pill { display: inline-block; font-size: 10px; padding: 2px 7px; margin: 1px 2px 1px 0;
    border-radius: 10px; background: var(--accent-soft); color: var(--accent);
    font-weight: 600; letter-spacing: 0.2px; white-space: nowrap; }
  .btn-export { background: #16a34a; }

  /* ---------- Mobile ---------- */
  @media (max-width: 720px) {
    body { padding: 14px 10px 32px; }
    h1 { font-size: 18px; }
    .controls { gap: 6px; }
    .controls input[type=text] {
      flex: 1 1 100%; padding: 11px 12px; font-size: 16px;
    }
    .controls input[type=number] {
      flex: 1 1 calc(50% - 60px); width: auto;
    }
    .controls button {
      flex: 1 1 100px; padding: 11px 14px;
    }
    .source-head { padding: 10px 12px; }
    .source-head h2 { font-size: 14px; }
    .source-head .meta { font-size: 11.5px; }
    .rank-controls { width: 100%; font-size: 12.5px; }
    .rank-controls select { flex: 1 1 140px; }
    .rank-controls button { flex: 1 1 100%; }
    table { font-size: 13px; min-width: 560px; }
    th, td { padding: 8px 10px; }
    td.title { max-width: 260px; }
    td.title a { font-size: 13px; }
    td.authors { display: none; }
    td.doi { max-width: 140px; font-size: 11px; }
    th.col-authors { display: none; }
    .pill { font-size: 9.5px; padding: 2px 6px; }
  }

  @media (max-width: 420px) {
    table { min-width: 480px; }
    td.doi, th.col-doi { display: none; }
    td.src-pills { max-width: 90px; white-space: normal; }
    td.journal, th.col-journal { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Paper agent — search across sources</h1>
  <div class="controls">
    <input type="text" id="q" placeholder='Which topic or review do you want to check for?'
           value='' autocomplete="off" autofocus>
    <input type="number" id="limit" value="25" min="5" max="200" title="Per source (how many papers to fetch from each API)" placeholder="per src">
    <input type="number" id="topNInput" value="100" min="10" max="500" title="Merged top (how many papers in the combined table)" placeholder="top N">
    <button id="go">Search</button>
    <button id="exportBtn" class="btn-export" disabled>Export to Excel</button>
  </div>
  <div class="hint">Left number = per source · Right number = merged top. Hover for details. Phrases in quotes are matched literally where supported.</div>
</header>
<main>
  <section class="source merged" id="sec-merged">
    <div class="source-head">
      <h2><span class="badge">Merged</span> Top <span id="topN">100</span> across all sources</h2>
      <div class="rank-controls">
        <label for="rankBy">Rank by</label>
        <select id="rankBy">
          <option value="citations">Citations (most cited)</option>
          <option value="year_desc">Year (newest first)</option>
          <option value="year_asc">Year (oldest first)</option>
          <option value="cpy">Citations / year (hot)</option>
          <option value="rrf">Relevance (RRF)</option>
        </select>
        <span class="meta" id="mergedMeta"></span>
      </div>
    </div>
    <div id="mergedBody" class="empty">Run a search to populate the merged table.</div>
  </section>
  <div id="out"></div>
</main>

<script>
const out = document.getElementById("out");
const q   = document.getElementById("q");
const lim = document.getElementById("limit");
const topNInput = document.getElementById("topNInput");
const btn = document.getElementById("go");
const exportBtn = document.getElementById("exportBtn");
const rankBy = document.getElementById("rankBy");
const mergedSec = document.getElementById("sec-merged");
let mergedBody = document.getElementById("mergedBody");
const mergedMeta = document.getElementById("mergedMeta");
const topNSpan = document.getElementById("topN");

let mergedPool = [];
let topN = 100;
let lastQuery = "";
let lastPerSource = {};   // {label: {rows, error}} snapshot for export
let lastRawTotal = 0;     // sum of rows across all sources before dedup

const SOURCES = {{ sources|tojson }};
const CURRENT_YEAR = new Date().getFullYear();

function skeleton() {
  out.innerHTML = SOURCES.map(([key, label]) => `
    <section class="source" id="sec-${key}">
      <div class="source-head">
        <h2>${label}</h2>
        <span class="meta"><span class="spinner"></span> fetching…</span>
      </div>
      <div class="empty">Waiting for results…</div>
    </section>`).join("");
  mergedSec.hidden = false;
  mergedBody.className = "empty";
  mergedBody.textContent = "Fetching all sources…";
  mergedMeta.innerHTML = '<span class="spinner"></span> building merged pool…';
}

function doiLink(doi) {
  if (!doi) return "";
  return `<a href="https://doi.org/${doi}" target="_blank" rel="noopener">${doi}</a>`;
}

function render(src) {
  const sec = document.getElementById(`sec-${src.key}`);
  if (!sec) return;
  const head = sec.querySelector(".source-head .meta");
  const rows = src.rows || [];
  if (src.error) {
    head.textContent = "error";
    sec.innerHTML = sec.querySelector(".source-head").outerHTML +
      `<div class="err">⚠ ${src.error}</div>`;
    return;
  }
  const fetched = src.fetched ?? rows.length;
  if (!rows.length) {
    // nothing came back and no error — hide this card entirely so the layout is quieter
    sec.remove();
    return;
  }
  head.textContent = `showing ${rows.length} of ${fetched}`;
  let body = `<div class="table-wrap"><table><thead><tr>
      <th>#</th><th>Year</th><th>Cites</th><th>Title</th>
      <th class="col-journal">Journal</th>
      <th class="col-authors">Authors</th><th class="col-doi">DOI / link</th>
    </tr></thead><tbody>`;
  rows.forEach((r, i) => {
    const authors = (r.authors || []).slice(0, 3).join(", ") +
                    ((r.authors || []).length > 3 ? " et al." : "");
    const titleHtml = r.url
      ? `<a href="${r.url}" target="_blank" rel="noopener">${escapeHtml(r.title || "(no title)")}</a>`
      : escapeHtml(r.title || "(no title)");
    body += `<tr>
        <td class="num">${i + 1}</td>
        <td class="num">${r.year ?? ""}</td>
        <td class="num">${r.citations ?? ""}</td>
        <td class="title">${titleHtml}</td>
        <td class="journal">${escapeHtml(r.journal || "")}</td>
        <td class="authors">${escapeHtml(authors)}</td>
        <td class="doi">${doiLink(r.doi)}</td>
      </tr>`;
  });
  body += `</tbody></table></div>`;
  sec.querySelector(".empty")?.remove();
  sec.insertAdjacentHTML("beforeend", body);
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function sortMerged(pool, mode) {
  const copy = pool.slice();
  const bigNeg = Number.NEGATIVE_INFINITY;
  const bigPos = Number.POSITIVE_INFINITY;
  if (mode === "citations") {
    copy.sort((a, b) => (b.citations ?? -1) - (a.citations ?? -1) || (b.year ?? 0) - (a.year ?? 0));
  } else if (mode === "year_desc") {
    copy.sort((a, b) => (b.year ?? bigNeg) - (a.year ?? bigNeg) || (b.citations ?? 0) - (a.citations ?? 0));
  } else if (mode === "year_asc") {
    copy.sort((a, b) => (a.year ?? bigPos) - (b.year ?? bigPos) || (b.citations ?? 0) - (a.citations ?? 0));
  } else if (mode === "cpy") {
    const cpy = p => (p.citations ?? 0) / Math.max(1, CURRENT_YEAR - (p.year ?? CURRENT_YEAR) + 1);
    copy.sort((a, b) => cpy(b) - cpy(a));
  } else if (mode === "rrf") {
    const K = 60;
    const score = p => {
      const r = p.rank_in_source || {};
      let s = 0;
      Object.values(r).forEach(rk => { s += 1 / (K + rk); });
      return s;
    };
    copy.sort((a, b) => score(b) - score(a));
  }
  return copy;
}

function renderMerged() {
  if (!mergedPool.length) {
    mergedBody.className = "empty";
    mergedBody.textContent = "No merged results.";
    mergedMeta.textContent = "";
    return;
  }
  const sorted = sortMerged(mergedPool, rankBy.value).slice(0, topN);
  mergedMeta.textContent = `top ${sorted.length} of ${mergedPool.length} unique papers (deduped from ${lastRawTotal} raw rows across ${SOURCES.length} sources)`;
  let body = `<div class="table-wrap"><table><thead><tr>
    <th>#</th><th>Year</th><th>Cites</th><th>C/yr</th>
    <th>Title</th>
    <th class="col-journal">Journal</th>
    <th class="col-authors">Authors</th>
    <th>Found in</th>
    <th class="col-doi">DOI</th>
  </tr></thead><tbody>`;
  sorted.forEach((r, i) => {
    const authors = (r.authors || []).slice(0, 3).join(", ") +
                    ((r.authors || []).length > 3 ? " et al." : "");
    const titleHtml = r.url
      ? `<a href="${r.url}" target="_blank" rel="noopener">${escapeHtml(r.title || "(no title)")}</a>`
      : escapeHtml(r.title || "(no title)");
    const cpy = r.citations && r.year
      ? (r.citations / Math.max(1, CURRENT_YEAR - r.year + 1)).toFixed(1)
      : "";
    const pills = (r.sources || []).map(s =>
      `<span class="pill">${escapeHtml(s)}</span>`).join("");
    body += `<tr>
      <td class="num">${i + 1}</td>
      <td class="num">${r.year ?? ""}</td>
      <td class="num">${r.citations ?? ""}</td>
      <td class="num">${cpy}</td>
      <td class="title">${titleHtml}</td>
      <td class="journal">${escapeHtml(r.journal || "")}</td>
      <td class="authors">${escapeHtml(authors)}</td>
      <td class="src-pills">${pills}</td>
      <td class="doi">${doiLink(r.doi)}</td>
    </tr>`;
  });
  body += `</tbody></table></div>`;
  mergedBody.className = "";
  mergedBody.innerHTML = body;
}

async function go() {
  const query = q.value.trim();
  if (!query) return;
  btn.disabled = true; btn.textContent = "Searching…";
  skeleton();
  try {
    const r = await fetch(`/search?q=${encodeURIComponent(query)}&limit=${encodeURIComponent(lim.value)}`);
    const data = await r.json();
    (data.sources || []).forEach(render);
    mergedPool = data.merged || [];
    topN = parseInt(topNInput.value, 10) || data.top_n || 100;
    topNSpan.textContent = topN;
    lastQuery = query;
    lastPerSource = {};
    lastRawTotal = 0;
    (data.sources || []).forEach(s => {
      lastPerSource[s.label] = { rows: s.rows || [], error: s.error || null };
      lastRawTotal += (s.rows || []).length;
    });
    exportBtn.disabled = mergedPool.length === 0;
    renderMerged();
  } catch (e) {
    out.innerHTML = `<div class="err">Request failed: ${e}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = "Search";
  }
}

async function exportToExcel() {
  if (!mergedPool.length) return;
  exportBtn.disabled = true;
  const original = exportBtn.textContent;
  exportBtn.textContent = "Exporting...";
  const current = sortMerged(mergedPool, rankBy.value).slice(0, topN);
  try {
    const r = await fetch("/export", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        query: lastQuery,
        merged: current,
        per_source: lastPerSource,
      }),
    });
    const ctype = r.headers.get("content-type") || "";
    if (!r.ok || ctype.includes("application/json")) {
      const d = await r.json();
      throw new Error(d.error || `HTTP ${r.status}`);
    }
    // Server streamed an .xlsx — trigger a browser download
    const blob = await r.blob();
    const disp = r.headers.get("content-disposition") || "";
    const nameMatch = disp.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/i);
    const filename = nameMatch ? decodeURIComponent(nameMatch[1]) : "papers.xlsx";
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    a.remove();
    URL.revokeObjectURL(url);
    exportBtn.textContent = "Downloaded ✓";
    showToast(`Downloaded: ${filename}`);
    setTimeout(() => { exportBtn.textContent = original; }, 2500);
  } catch (e) {
    alert("Export failed: " + e.message);
    exportBtn.textContent = original;
  } finally {
    exportBtn.disabled = false;
  }
}

function showToast(msg) {
  let t = document.getElementById("toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "toast";
    t.style.cssText = "position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--border);border-left:4px solid #16a34a;padding:12px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);max-width:420px;z-index:1000;color:var(--text);";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.style.display = "none"; }, 5000);
}

btn.addEventListener("click", go);
q.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
lim.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
topNInput.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
rankBy.addEventListener("change", () => { if (mergedPool.length) renderMerged(); });
topNInput.addEventListener("change", () => {
  topN = parseInt(topNInput.value, 10) || 100;
  topNSpan.textContent = topN;
  if (mergedPool.length) renderMerged();
});
exportBtn.addEventListener("click", exportToExcel);
</script>
</body>
</html>
